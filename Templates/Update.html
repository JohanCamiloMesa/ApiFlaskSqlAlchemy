{% extends "Layout.html" %}

{% block body %}
<div class="row">
    <div class="col-md-5">
        <div class="card bg-dark text-light">
            <div class="card-body">
                <form action="{{ url_for('contacts.update_contact', id=contact.id) }}" method="POST">    
                    <div class="mb-3">
                        <label class="d-block">Actualiza el nombre</label>
                        <input type="text" name="name" value="{{ contact.name }}" 
                        class="form-control rounded-0 bg-white border-0" 
                        required>
                    </div>

                    <div class="mb-3">
                        <label class="d-block">Actualiza el correo electronico</label>
                        <input type="text" name="email" value="{{ contact.email }}" 
                        class="form-control rounded-0 bg-white border-0" 
                        required>
                    </div>

                    <div class="mb-3">
                        <label class="d-block">Actualiza el numero de telefono</label>
                        <input type="text" name="phone_number" value="{{ contact.phone_number }}" 
                        class="form-control rounded-0 bg-white border-0" 
                        required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">Save</button>
                        <a href="{{ url_for('contacts.home') }}" class="btn btn-secondary flex-grow-1">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
